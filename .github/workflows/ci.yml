name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ansible-core i3-wm sway
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh home/dot_profile home/dot_config/shell/aliases.sh home/dot_config/shell/tools.sh \
            home/dot_local/bin/executable_notebook
          shellcheck -s bash home/dot_bashrc home/dot_bash_profile home/dot_config/bash/*.bash
      - name: Ansible syntax
        run: ansible-playbook --syntax-check -i localhost, setup/linux.yml
      - name: i3 config
        run: i3 -C -c home/dot_config/i3/config
      - name: sway config
        run: |
          mkdir -p -m 700 /tmp/xdg
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 XDG_RUNTIME_DIR=/tmp/xdg \
            sway --validate -c home/dot_config/sway/config

  # Run the Linux playbook for real (skipping the slow or runner-hostile parts)
  playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible-core
      - name: ansible-playbook
        # nopasswd_sudo=true keeps the runner's own passwordless sudo in place
        run: >-
          ansible-playbook -i localhost, -c local setup/linux.yml
          -e '{"tiling_wm": "i3", "upgrade_packages": false, "install_docker": false,
          "install_desktop": false, "nopasswd_sudo": true}'
      - name: Tools are installed
        run: |
          "$HOME/.local/bin/nvim" --version | head -1
          "$HOME/.local/bin/fnm" --version
          "$HOME/.local/bin/uv" --version
          command -v i3 zsh tmux

  # Apply the dotfiles (without installing packages) and start each shell and tmux
  apply:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runs-on: ubuntu-latest
          - name: fedora
            runs-on: ubuntu-latest
            container: fedora:latest
          - name: macos
            runs-on: macos-latest
    name: apply (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    env:
      TERM: xterm-256color # a real terminal always sets it; CI has none
    steps:
      - name: Install shells and tmux
        run: |
          if command -v dnf >/dev/null; then dnf install -y git zsh tmux bash-completion
          elif command -v apt-get >/dev/null; then sudo apt-get update && sudo apt-get install -y zsh tmux
          else brew install tmux; fi
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: chezmoi apply
        run: |
          "$HOME/.local/bin/chezmoi" init --apply --source="$GITHUB_WORKSPACE" \
            --promptBool "Install packages (Homebrew or Ansible)=false" \
            --promptChoice "Login shell=unchanged,Tiling window manager=none"
      - name: Shells start without errors
        shell: bash
        run: |
          set -euo pipefail
          check() {
            echo "== $*"
            err=$("$@" -c 'type mcd >/dev/null && alias ll >/dev/null && echo "$PATH"' 2>&1 >/dev/null \
              | grep -v -e 'no job control' -e 'cannot set terminal process group' || true)
            if [ -n "$err" ]; then echo "$err"; return 1; fi
          }
          # macOS uses zsh only; its bash files aren't installed
          if [ "$RUNNER_OS" != macOS ]; then
            check bash -i
            check bash -il
          fi
          check zsh -i
          check zsh -il
      - name: tmux loads the config and plugins
        shell: bash
        run: |
          set -euo pipefail
          shells=("$(command -v zsh)")
          [ "$RUNNER_OS" = macOS ] || shells+=("$(command -v bash)")
          for shell in "${shells[@]}"; do
            SHELL=$shell tmux -f "$HOME/.tmux.conf" new-session -d -x 100 -y 20
            sleep 2
            keys=$(tmux list-keys)
            cmd=$(tmux display -p '#{pane_current_command}')
            tmux kill-server
            echo "== $shell: pane runs '$cmd'"
            grep -q 'M-h.*select-pane' <<<"$keys" || { echo "M-h binding missing"; exit 1; }
            grep -q resurrect <<<"$keys" || { echo "tmux-resurrect not loaded:"; ls "$HOME/.tmux/plugins"; exit 1; }
            # a login shell may show as -zsh
            [ "${cmd#-}" = "$(basename "$shell")" ] || { echo "expected $(basename "$shell")"; exit 1; }
          done
