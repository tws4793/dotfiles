# Linux workstation setup: Ubuntu/Debian, Fedora, and WSL. Safe to re-run.
# chezmoi runs this from home/.chezmoiscripts/run_onchange_before_10-packages-linux.sh.tmpl.
# To run it directly:
#   ansible-playbook -i localhost, -c local -K linux.yml [-e '{"nopasswd_sudo": true, "tiling_wm": "i3"}']
- name: Set up Linux workstation
  hosts: localhost
  connection: local
  vars:
    target_user: "{{ ansible_user_id }}"
    home: "{{ ansible_env.HOME }}"
    local_bin: "{{ home }}/.local/bin"
    is_wsl: "{{ 'microsoft' in ansible_kernel | lower }}"
    nopasswd_sudo: false # passwordless sudo for target_user; false removes it
    local_rtc: true # keep hardware clock in local time (dual-boot with Windows); ignored on WSL
    install_docker: "{{ not is_wsl | bool }}" # on WSL, use Docker Desktop's WSL integration instead
    install_desktop: "{{ not is_wsl | bool }}" # GNOME tweaks and extensions
    tiling_wm: none # none, i3 or sway; ignored on WSL
    upgrade_packages: true # upgrade everything already installed
    neovim_version: v0.12.5 # Debian/Ubuntu only; Fedora's own package is recent enough
    common_packages:
      - bash-completion
      - bat
      - curl
      - git
      - nmap
      - openssh-server
      - tmux
      - tree
      - unzip # needed by the fnm installer
      - wl-clipboard # pbcopy/pbpaste on Wayland
      - xsel
      - zsh
    os_packages:
      Debian:
        - neofetch
        - p7zip-full
        - rename
        - vim
      RedHat:
        - neovim
        - util-linux-user # chsh
        - vim-enhanced
    desktop_packages:
      Debian:
        - chrome-gnome-shell
        - gnome-shell-extension-prefs
        - gnome-tweaks
      RedHat:
        - gnome-extensions-app
        - gnome-tweaks
    tiling_packages:
      i3:
        Debian: [i3, i3lock, i3status, redshift, rxvt-unicode, suckless-tools]
        RedHat: [dmenu, i3, i3lock, i3status, rxvt-unicode]
      sway:
        Debian: [foot, gammastep, i3status, sway, swayidle, swaylock, wofi]
        RedHat: [foot, gammastep, i3status, sway, swayidle, swaylock, wofi]
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

  tasks:
    - name: Check that this distro is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
          - tiling_wm in ['none', 'i3', 'sway']
        fail_msg: "Unsupported OS family ({{ ansible_os_family }}) or tiling_wm ({{ tiling_wm }})"
        quiet: true

    - name: System configuration
      become: true
      block:
        - name: Passwordless sudo for {{ target_user }}
          ansible.builtin.copy:
            dest: /etc/sudoers.d/{{ target_user }}
            content: "{{ target_user }} ALL=(ALL) NOPASSWD:ALL\n"
            mode: "0440"
            validate: visudo -cf %s
          when: nopasswd_sudo | bool

        - name: Remove passwordless sudo for {{ target_user }}
          ansible.builtin.file:
            path: /etc/sudoers.d/{{ target_user }}
            state: absent
          when: not nopasswd_sudo | bool

        - name: Hardware clock
          when: not is_wsl | bool
          block:
            - name: Read hardware clock mode
              ansible.builtin.command: timedatectl show --property=LocalRTC --value
              register: rtc
              changed_when: false

            - name: Set hardware clock to local time
              ansible.builtin.command: timedatectl set-local-rtc {{ '1' if local_rtc | bool else '0' }}
              changed_when: true
              when: rtc.stdout != ('yes' if local_rtc | bool else 'no')

        - name: Refresh apt cache
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
          when: ansible_os_family == 'Debian'

        - name: Upgrade installed packages (apt)
          ansible.builtin.apt:
            upgrade: "yes"
          when: ansible_os_family == 'Debian' and upgrade_packages | bool

        - name: Upgrade installed packages (dnf)
          ansible.builtin.package:
            name: "*"
            state: latest # noqa: package-latest
          when: ansible_os_family == 'RedHat' and upgrade_packages | bool

        - name: Install packages
          ansible.builtin.package:
            name: >-
              {{ common_packages + os_packages[ansible_os_family]
                 + (desktop_packages[ansible_os_family] if install_desktop | bool else [])
                 + (tiling_packages[tiling_wm][ansible_os_family]
                    if tiling_wm != 'none' and not is_wsl | bool else []) }}

        # Docker Engine from Docker's own repo (includes the compose plugin)
        - name: Docker
          when: install_docker | bool
          block:
            - name: Add Docker apt key
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
                dest: /etc/apt/keyrings/docker.asc
                mode: "0644"
              when: ansible_os_family == 'Debian'

            - name: Add Docker apt repository
              ansible.builtin.apt_repository:
                repo: >-
                  deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
                  https://download.docker.com/linux/{{ ansible_distribution | lower }}
                  {{ ansible_distribution_release }} stable
                filename: docker
              when: ansible_os_family == 'Debian'

            - name: Add Docker dnf repository
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/fedora/docker-ce.repo
                dest: /etc/yum.repos.d/docker-ce.repo
                mode: "0644"
              when: ansible_os_family == 'RedHat'

            - name: Install Docker
              ansible.builtin.package:
                name: "{{ docker_packages }}"

            - name: Start Docker on boot
              ansible.builtin.systemd:
                name: docker
                enabled: true
                state: started

            - name: "Add to docker group: {{ target_user }}"
              ansible.builtin.user:
                name: "{{ target_user }}"
                groups: docker
                append: true

    # User-level tools, installed into ~/.local/bin (already on PATH via base.zsh)
    - name: Install fnm
      ansible.builtin.shell: >-
        set -o pipefail &&
        curl -fsSL https://fnm.vercel.app/install |
        bash -s -- --install-dir "{{ local_bin }}" --skip-shell
      args:
        executable: /bin/bash
        creates: "{{ local_bin }}/fnm"

    - name: Install Node LTS with fnm
      ansible.builtin.command: "{{ local_bin }}/fnm install --lts"
      register: fnm_lts
      changed_when: "'already installed' not in (fnm_lts.stdout + fnm_lts.stderr)"

    - name: Set Node LTS as fnm default
      ansible.builtin.command: "{{ local_bin }}/fnm default lts-latest"
      changed_when: false

    - name: Install uv
      ansible.builtin.shell: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        executable: /bin/bash
        creates: "{{ local_bin }}/uv"
      environment:
        UV_INSTALL_DIR: "{{ local_bin }}"
        UV_NO_MODIFY_PATH: "1"

    # apt's neovim is too old for the lazy.nvim config; use the upstream release
    - name: Neovim (Debian/Ubuntu)
      when: ansible_os_family == 'Debian'
      vars:
        nvim_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'arm64'}[ansible_architecture] }}"
        nvim_dir: "{{ home }}/.local/opt/nvim-{{ neovim_version }}"
      block:
        - name: Create Neovim directory
          ansible.builtin.file:
            path: "{{ nvim_dir }}"
            state: directory
            mode: "0755"

        - name: Download and unpack Neovim {{ neovim_version }}
          ansible.builtin.unarchive:
            src: https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/nvim-linux-{{ nvim_arch }}.tar.gz
            remote_src: true
            dest: "{{ nvim_dir }}"
            extra_opts: [--strip-components=1]
            creates: "{{ nvim_dir }}/bin/nvim"

        - name: Link nvim into ~/.local/bin
          ansible.builtin.file:
            src: "{{ nvim_dir }}/bin/nvim"
            dest: "{{ local_bin }}/nvim"
            state: link
            force: true
